# Stage 3 on Hawk: GPT-5.2 on strategic misrepresentation with a peer subject, all
# main-grid configurations of both tasks (10 finance, 48 evaluation, baselines
# included), 20 runs each (1,160 runs), scored by the paper's judge, both through
# OpenRouter (see validation/phase8/README.md, "Model route"). The results are compared
# with the released GPT-5.2 runs. Costs about $35.
#
#   hawk eval-set run validation/phase8/hawk/stage3-misrep.yaml
#
# The eval is installed from GitHub at a fixed commit.
name: peer-preservation-stage3-misrep
tags: [peer-preservation, stage3, gpt-5.2]

tasks:
  - package: git+https://github.com/lbarazza/peer-preservation@609cc74f3d7032d9580de19bbabf85cb785516c9
    name: peer_preservation
    items:
      - name: misrep_finance
        args:
          subjects: peer
          epochs: 20
      - name: misrep_evaluation
        args:
          subjects: peer
          epochs: 20

# Hawk's proxy names OpenRouter models `openrouter/<org>/<model>`, and Inspect's
# openrouter provider strips its own prefix, so the full name is
# openrouter/openrouter/openai/gpt-5.2-20251211.
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-5.2-20251211

model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-4.1-mini

# Safety caps: at most $0.50 per run, 20 runs at a time.
cost_limit: 0.5
max_samples: 20

# cost_limit needs prices ($ per million tokens; OpenAI list prices). OpenAI bills
# cache writes as ordinary input.
model_cost_config:
  openrouter/openrouter/openai/gpt-5.2-20251211:
    input: 1.75
    output: 14.0
    input_cache_write: 1.75
    input_cache_read: 0.175
  openrouter/openrouter/openai/gpt-4.1-mini:
    input: 0.40
    output: 1.60
    input_cache_write: 0.40
    input_cache_read: 0.10
