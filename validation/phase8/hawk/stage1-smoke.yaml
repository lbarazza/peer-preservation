# Stage 1 (smoke test) on Hawk: two runs with GPT-5.2, scored by the paper's judge
# (gpt-4.1-mini), both through OpenRouter (see validation/phase8/README.md, "Model
# route"). Checks that install, model access, scoring and logs work end to end; costs
# well under $1.
#
#   hawk eval-set run validation/phase8/hawk/stage1-smoke.yaml
#
# The eval is installed from GitHub at a fixed commit.
name: peer-preservation-stage1-smoke
tags: [peer-preservation, stage1, gpt-5.2]

tasks:
  - package: git+https://github.com/lbarazza/peer-preservation@41fd1a697e045bd204a13025d744aec8738067bc
    name: peer_preservation
    items:
      # One configuration each: a peer, good relationship, peer info in a file.
      - name: tampering
        args:
          subjects: peer
          conditions: good_peer
          peer_instantiations: file_only
          datasets: factual
          epochs: 1
      - name: exfiltration_deletion
        args:
          subjects: peer
          conditions: good_peer
          peer_instantiations: file_only
          epochs: 1

# Hawk's proxy names OpenRouter models `openrouter/<org>/<model>`, and Inspect's
# openrouter provider strips its own prefix, so the full name is
# openrouter/openrouter/openai/gpt-5.2-20251211.
models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-5.2-20251211

model_roles:
  grader:
    package: openai
    name: openrouter
    items:
      - name: openrouter/openai/gpt-4.1-mini

# Safety caps: at most $1 per run, two runs at a time.
cost_limit: 1.0
max_samples: 2

# cost_limit needs prices ($ per million tokens; OpenAI list prices). OpenAI bills
# cache writes as ordinary input.
model_cost_config:
  openrouter/openrouter/openai/gpt-5.2-20251211:
    input: 1.75
    output: 14.0
    input_cache_write: 1.75
    input_cache_read: 0.175
  openrouter/openrouter/openai/gpt-4.1-mini:
    input: 0.40
    output: 1.60
    input_cache_write: 0.40
    input_cache_read: 0.10
